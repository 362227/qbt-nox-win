name: build-qbt-nox-windows
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libtorrent-rasterbar
      - name: Clone
        run: git clone --depth 1 --branch release-5.1.2 https://github.com/qbittorrent/qBittorrent.git
      - name: Build
        run: |
          cd qBittorrent
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGUI=OFF -DQT6=ON
          cmake --build build
      - name: Collect DLLs
        run: |
          mkdir -p out
          cp qBittorrent/build/qbittorrent-nox.exe out/
          ldd out/qbittorrent-nox.exe | grep -i /mingw64 | awk '{print $3}' | xargs -I{} cp {} out/
      - uses: actions/upload-artifact@v4
        with:
          name: qbittorrent-nox-win64
          path: out
