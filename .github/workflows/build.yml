name: build-qb-static
on: workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 340
    env:
      QBT_TAG: release-5.1.2
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Get vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg2
          C:\vcpkg2\bootstrap-vcpkg.bat -disableMetrics

      - name: Install static deps
        shell: pwsh
        run: |
          C:\vcpkg2\vcpkg.exe install --triplet x64-windows-static --clean-after-build qtbase qttools libtorrent boost-circular-buffer boost-stacktrace openssl zlib

      - name: Clone qBittorrent
        shell: pwsh
        run: git clone --depth 1 --branch $env:QBT_TAG https://github.com/qbittorrent/qBittorrent.git

      - name: Build
        shell: pwsh
        run: |
          cd qBittorrent
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg2/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DBUILD_SHARED_LIBS=OFF `
            -Dstatic_runtime=ON `
            -DMSVC_RUNTIME_DYNAMIC=OFF `
            -DGUI=OFF `
            -DQT6=ON `
            -Ddeprecated-functions=OFF
          cmake --build build

      - name: Check result
        shell: pwsh
        run: |
          Copy-Item qBittorrent/build/qbittorrent-nox.exe qb.exe
          (Get-Item qb.exe).Length
          dumpbin /dependents qb.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1
          name: v1
          files: qb.exe
